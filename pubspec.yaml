name: masttersystem
description: ERP para Gráficas e Comunicação Visual
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # XML (para importação de NF-e e NFS-e)
  xml: ^6.3.0
  
  # Excel (para importação de XLS e XLSX)
  excel: ^3.0.0
  csv: ^5.1.1
  
  # Imagens
  image_picker: ^1.0.7
  
  # Arquivos
  file_picker: ^8.3.7

  # Banco de Dados
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  sqlite3: ^3.5.1
  path: ^1.8.3
  path_provider: ^2.1.0

  # State Management
  provider: ^6.0.5

  # Storage
  shared_preferences: ^2.2.2

  # Utils
  intl: ^0.18.1
  uuid: ^4.1.0
  url_launcher: ^6.2.1
  crypto: ^3.0.7
  cryptography: ^2.7.0
  http: ^1.2.2

  # PDF and Printing
  pdf: ^3.10.4
  printing: ^5.11.0

  # UI
  flutter_slidable: ^3.0.1
  flutter_staggered_animations: ^1.1.0

  # Splash e Ícones
  flutter_native_splash: ^2.3.2
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  shared_preferences_platform_interface: ^2.4.2
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/
    - assets/admin_installers/

# ============================================================
# Splash Screen
# ============================================================
flutter_native_splash:
  color: "#0F62AC"
  image: assets/images/logo_white.png
  android: true
  ios: false
  web: false
  android_gravity: center
  fullscreen: true

# ============================================================
# Ícones do Aplicativo
# ============================================================
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0F62AC"
  adaptive_icon_foreground: "assets/images/logo_white.png"
  min_sdk_android: 21
