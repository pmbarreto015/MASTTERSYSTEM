services:
  licenses:
    build:
      context: ../..
      dockerfile: deploy/licensing/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      LICENSE_DATA_FILE: /var/data/lan_licenses.json
      LICENSE_TRUST_PROXY: "1"
      LICENSE_ADMIN_TOKEN: ${LICENSE_ADMIN_TOKEN:?Defina uma credencial de pelo menos 32 caracteres}
    volumes:
      - licenses_data:/var/data
    expose:
      - "8787"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - licenses
    environment:
      LICENSE_DOMAIN: ${LICENSE_DOMAIN:?Informe o domínio apontado para este servidor}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  licenses_data:
  caddy_data:
  caddy_config:
