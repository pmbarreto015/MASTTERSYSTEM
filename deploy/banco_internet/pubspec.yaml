name: matterdi_banco_internet
description: Servidor de banco do MatterdiSistem para hospedagem independente.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  sqflite_common: 2.5.8
  sqflite_common_ffi: 2.4.0+3
  sqlite3: 3.5.1

# O SQLite nativo acompanha o bundle gerado por dart build cli.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3
